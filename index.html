<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Registro de Estudiantes — Supabase (SQL en la Nube)</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Cliente de Supabase vía CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { -webkit-tap-highlight-color: transparent; }
  .toast { transition: opacity 0.3s ease, transform 0.3s ease; }
</style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-800 antialiased">

  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div>
        <h1 class="text-lg sm:text-2xl font-bold leading-tight">📚 Registro con Supabase (SQL)</h1>
        <p class="text-emerald-200 text-xs sm:text-sm">Sincronización en tiempo real (Laptop & Celular)</p>
      </div>
      <span id="db-status" class="text-xs sm:text-sm bg-emerald-800/60 px-3 py-1 rounded-full whitespace-nowrap">
        Conectando a Supabase…
      </span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-6">

    <!-- Formulario -->
    <section class="bg-white rounded-2xl shadow p-4 sm:p-6">
      <h2 class="text-base sm:text-lg font-semibold mb-4 text-slate-700">➕ Nuevo estudiante</h2>
      <form id="form-estudiante" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
        <div class="sm:col-span-2">
          <label class="block text-xs font-medium text-slate-500 mb-1">Nombre</label>
          <input id="input-nombre" type="text" required placeholder="Ej: Ana Gómez"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Materia</label>
          <input id="input-materia" type="text" required placeholder="Ej: Bases de Datos"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Nota</label>
          <input id="input-nota" type="number" min="0" max="100" required placeholder="0-100"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div class="sm:col-span-4 flex justify-end">
          <button type="submit"
            class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 active:scale-95 transition text-white font-medium px-5 py-2.5 rounded-lg text-sm shadow">
            Guardar en Supabase
          </button>
        </div>
      </form>
    </section>

    <!-- Tabla -->
    <section class="bg-white rounded-2xl shadow p-4 sm:p-6">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
        <h2 class="text-base sm:text-lg font-semibold text-slate-700">📋 Estudiantes registrados</h2>
        <span id="contador" class="text-xs text-slate-400">0 registros</span>
      </div>

      <div class="overflow-x-auto rounded-lg border border-slate-200">
        <table class="w-full text-sm text-left">
          <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
            <tr>
              <th class="px-3 py-2">ID</th>
              <th class="px-3 py-2">Nombre</th>
              <th class="px-3 py-2">Materia</th>
              <th class="px-3 py-2">Nota</th>
              <th class="px-3 py-2 text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-body" class="divide-y divide-slate-100">
            <tr><td colspan="5" class="px-3 py-6 text-center text-slate-400">Cargando datos de Supabase…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast fixed bottom-4 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none
       bg-slate-900 text-white text-sm px-4 py-2 rounded-full shadow-lg z-50"></div>

  <!-- Lógica de Supabase -->
  <script>
    // PEGA AQUÍ TUS CREDENCIALES DE SUPABASE
    const SUPABASE_URL = 'https://jfzmbttshakjqgygrctk.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impmem1idHRzaGFranFneWdyY3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MDgxMzYsImV4cCI6MjEwNDI4NDEzNn0.L4AaYsCR77FHAb-_S84fnP0INgfl_RM3wO1sLe6ByAQ';

    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const dbStatusEl = document.getElementById('db-status');
    const formEl = document.getElementById('form-estudiante');
    const tablaBodyEl = document.getElementById('tabla-body');
    const contadorEl = document.getElementById('contador');
    const toastEl = document.getElementById('toast');

    function mostrarToast(mensaje) {
      toastEl.textContent = mensaje;
      toastEl.style.opacity = '1';
      toastEl.style.transform = 'translate(-50%, -8px)';
      clearTimeout(mostrarToast._t);
      mostrarToast._t = setTimeout(() => {
        toastEl.style.opacity = '0';
        toastEl.style.transform = 'translate(-50%, 0)';
      }, 1800);
    }

    // Cargar los registros iniciales mediante una consulta SQL (equivalente a SELECT)
    async function cargarEstudiantes() {
      const { data, error } = await _supabase
        .from('estudiantes')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error(error);
        dbStatusEl.textContent = '⚠️ Error al conectar';
        mostrarToast('Error al cargar datos de Supabase');
        return;
      }

      dbStatusEl.textContent = '✅ Conectado a Supabase (SQL)';
      pintarTabla(data);
    }

    function pintarTabla(filas) {
      tablaBodyEl.innerHTML = '';
      contadorEl.textContent = `${filas.length} registro${filas.length === 1 ? '' : 's'}`;

      if (filas.length === 0) {
        tablaBodyEl.innerHTML = `<tr><td colspan="5" class="px-3 py-6 text-center text-slate-400">Aún no hay estudiantes registrados.</td></tr>`;
        return;
      }

      for (const row of filas) {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50';
        tr.innerHTML = `
          <td class="px-3 py-2 text-slate-400">${row.id}</td>
          <td class="px-3 py-2 font-medium">${escapeHtml(row.nombre)}</td>
          <td class="px-3 py-2">${escapeHtml(row.materia)}</td>
          <td class="px-3 py-2">
            <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${colorNota(row.nota)}">${row.nota}</span>
          </td>
          <td class="px-3 py-2 text-right">
            <button data-id="${row.id}" class="btn-borrar text-red-500 hover:text-red-700 text-xs font-medium">
              Eliminar
            </button>
          </td>`;
        tablaBodyEl.appendChild(tr);
      }

      document.querySelectorAll('.btn-borrar').forEach(btn => {
        btn.addEventListener('click', () => eliminarEstudiante(Number(btn.dataset.id)));
      });
    }

    // Insertar un registro (equivalente a INSERT INTO)
    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nombre = document.getElementById('input-nombre').value.trim();
      const materia = document.getElementById('input-materia').value.trim();
      const nota = Number(document.getElementById('input-nota').value);

      if (!nombre || !materia || Number.isNaN(nota)) return;

      const { error } = await _supabase
        .from('estudiantes')
        .insert([{ nombre, materia, nota }]);

      if (error) {
        console.error(error);
        mostrarToast('Error al guardar en Supabase');
        return;
      }

      formEl.reset();
      document.getElementById('input-nombre').focus();
      mostrarToast('Guardado en Supabase ✔');
    });

    // Eliminar un registro (equivalente a DELETE FROM)
    async function eliminarEstudiante(id) {
      const { error } = await _supabase
        .from('estudiantes')
        .delete()
        .eq('id', id);

      if (error) {
        console.error(error);
        mostrarToast('Error al eliminar');
        return;
      }

      mostrarToast('Registro eliminado');
    }

    function colorNota(nota) {
      if (nota >= 51) return 'bg-emerald-100 text-emerald-700';
      if (nota >= 30) return 'bg-amber-100 text-amber-700';
      return 'bg-red-100 text-red-700';
    }

    function escapeHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto;
      return div.innerHTML;
    }

    // Escuchar cambios en TIEMPO REAL (Realtime) para que se actualice solo en celular y laptop
    _supabase
      .channel('public:estudiantes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'estudiantes' }, (payload) => {
        cargarEstudiantes(); // Recarga la tabla automáticamente al haber cualquier cambio en la base de datos
      })
      .subscribe();

    // Cargar datos al iniciar la página
    cargarEstudiantes();
  </script>
</body>
</html>
